name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run typecheck
      # The unit suite covers the Process Bar approval logic — the
      # human-oversight surface. It existed but was never gated here.
      - run: npm test
      - run: npm run build
